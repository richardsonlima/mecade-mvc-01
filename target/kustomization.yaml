# Online Boutique fixado na release v0.10.5, com imagens no google-samples.
# Se eu trocar de versão, mudo esta URL e o versions.env juntos e anoto no CHANGELOG.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/v0.10.5/release/kubernetes-manifests.yaml
patches:
  # Tiro o gerador de carga original; a carga da campanha vem de load/ (taxa e semente fixas).
  - target: {kind: Deployment, name: loadgenerator}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - target: {kind: ServiceAccount, name: loadgenerator}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
  # Tiro também o LoadBalancer externo: no GKE ele custa dinheiro, e a carga roda dentro do cluster.
  - target: {kind: Service, name: frontend-external}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
