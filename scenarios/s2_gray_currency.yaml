id: s2_gray_currency
version: 1
hipotese: >
  O estado estacionário persiste, ou é restaurado dentro do RTO, sob timeouts intermitentes
  (rajadas de latência elevada) em uma instância do currencyservice, caracterizando uma gray failure.
modo_de_falha:
  tipo: timeout intermitente (gray failure)
  causa_presumida: vizinho ruidoso / instabilidade intermitente de rede
  efeito_local: rajadas de respostas muito lentas
  efeito_sistemico: picos de latência e timeouts esporádicos, sem violação contínua de limiar instantâneo
alvo: currencyservice
nivel_de_injecao: servico (instância específica)
metricas_observadas: [p95, p99, error_rate]
rto_s: 180
mitigacao:
  acao: restart
runbook: "Substituir instâncias degradadas: kubectl rollout restart deployment/currencyservice"
replicas_alvo: 1
chaos:
  apiVersion: chaos-mesh.org/v1alpha1
  kind: Schedule
  metadata: {name: "{name}", namespace: "{ns}"}
  spec:
    schedule: "@every 60s"
    type: NetworkChaos
    historyLimit: 20
    concurrencyPolicy: Forbid
    networkChaos:
      action: delay
      mode: all
      selector:
        pods: {"{ns}": "{pods}"}
      delay: {latency: "1500ms", jitter: "1000ms", correlation: "50"}
      duration: "20s"
