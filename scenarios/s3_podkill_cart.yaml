id: s3_podkill_cart
version: 1
hipotese: >
  O estado estacionário persiste, ou é restaurado dentro do RTO, sob encerramentos repetidos
  de instâncias do cartservice.
modo_de_falha:
  tipo: indisponibilidade de instância (pod kill)
  causa_presumida: falha de processo / evicção
  efeito_local: cartservice indisponível até o reagendamento e a prontidão do novo pod
  efeito_sistemico: erros em addToCart, viewCart e checkout
alvo: cartservice
nivel_de_injecao: infraestrutura (seleção por rótulo; afeta também pods novos)
metricas_observadas: [p95, p99, error_rate]
rto_s: 180
mitigacao:
  acao: scale                  # com 3 réplicas, perder uma não derruba o serviço
  replicas: 3
runbook: "Aumentar redundância: kubectl scale deployment/cartservice --replicas=3"
replicas_alvo: 1
chaos:
  apiVersion: chaos-mesh.org/v1alpha1
  kind: Schedule
  metadata: {name: "{name}", namespace: "{ns}"}
  spec:
    schedule: "@every 45s"
    type: PodChaos
    historyLimit: 20
    concurrencyPolicy: Forbid
    podChaos:
      action: pod-kill
      mode: one
      selector:
        namespaces: ["{ns}"]
        labelSelectors: {app: cartservice}
